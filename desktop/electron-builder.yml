appId: com.workspace-ai.desktop
productName: Workspace AI
directories:
  output: release
files:
  - dist/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: ../backend/dist
    to: backend
  - from: ../backend/prisma
    to: prisma
  - from: ../frontend/dist
    to: frontend
  - from: ../shared
    to: shared
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.developer-tools
  darkModeSupport: true
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
